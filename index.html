<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Farm IoT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@800&display=swap" rel="stylesheet">
<style>
  :root {
    --box: #e6d5ce; --box-hover: #ecddd6; --knob: #b0958c;
    --red: #ee7b6b; --green: #94bb6f; --orange: #fda26b; --blue: #7ab5e0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #fdf5f2; }

  /* เวที 1920x1080 ย่อ/ขยายแบบ cover ให้ตรงกับรูปพื้นหลังเสมอ */
  .stage {
    position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
    transform: translate(-50%, -50%) scale(var(--s, 1));
    background: url("2.png") center / 100% 100% no-repeat;
    font-family: "Sniglet", "Mali", "Tahoma", sans-serif;
  }
  .stage > * { pointer-events: auto; }
  .fx-layer, #fx { pointer-events: none !important; }

  /* ---------- เลเยอร์พื้นหลังเคลื่อนไหว ---------- */
  .sky, .glow, .shimmer { position: absolute; z-index: 1; pointer-events: none; }
  .sky { inset: 0; overflow: hidden; }

  .cloud {
    position: absolute; left: 0; width: 6em; height: 1.6em; border-radius: 1.6em;
    background: rgba(230, 213, 206, .5);
    animation: drift var(--d, 120s) linear infinite; animation-delay: var(--delay, 0s);
  }
  .cloud::before, .cloud::after { content: ""; position: absolute; border-radius: 50%; background: inherit; }
  .cloud::before { left: .9em; top: -.9em; width: 2.2em; height: 2.2em; }
  .cloud::after  { left: 2.6em; top: -1.4em; width: 2.8em; height: 2.8em; }
  @keyframes drift { from { transform: translateX(-520px); } to { transform: translateX(2300px); } }

  .glow {
    right: -120px; top: -160px; width: 760px; height: 760px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 207, 100, .5), rgba(255, 207, 100, 0) 66%);
    animation: glow 6s ease-in-out infinite alternate;
  }
  @keyframes glow { from { opacity: .35; transform: scale(.94); } to { opacity: .85; transform: scale(1.08); } }

  /* แสงวาบพาดผ่านชื่อเรื่อง */
  .shimmer { left: 470px; top: 135px; width: 980px; height: 125px; overflow: hidden; }
  .shimmer::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 140px; left: -200px;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.95), transparent);
    mix-blend-mode: overlay; transform: skewX(-18deg);
    animation: sweep 7s ease-in-out infinite 2s;
  }
  @keyframes sweep { 0% { left: -200px; } 22%, 100% { left: 1100px; } }

  /* ---------- กล่องค่าเซนเซอร์ ---------- */
  .card {
    position: absolute; z-index: 2; top: 358px; left: var(--l); width: 209px; height: 185px;
    border-radius: 62px; background: transparent;
    display: flex; align-items: center; justify-content: center; cursor: default;
    transform: perspective(700px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(var(--sc, 1));
    transition: transform .22s ease-out, background-color .25s ease, box-shadow .3s ease;
  }
  .card:hover { --sc: 1.07; background-color: var(--box-hover); box-shadow: 0 14px 28px rgba(176,149,140,.35); }
  .card.on { box-shadow: inset 0 0 0 4px color-mix(in srgb, var(--c) 45%, transparent); }
  .card.on:hover { box-shadow: inset 0 0 0 4px color-mix(in srgb, var(--c) 45%, transparent), 0 14px 28px rgba(176,149,140,.35); }

  /* วงแหวนพัลส์เมื่อเซนเซอร์ "สด" */
  .card::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    border: 3px solid var(--c); opacity: 0; pointer-events: none;
  }
  .card.on::after { animation: ring 2s ease-out infinite; }
  @keyframes ring { 0% { transform: scale(1); opacity: .65; } 100% { transform: scale(1.28); opacity: 0; } }

  /* แสงเงาไล่ผ่านกล่องตอนชี้เมาส์ */
  .shine { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; }
  .shine::before {
    content: ""; position: absolute; top: -10%; bottom: -10%; width: 60px; left: -90px;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.6), transparent);
    transform: skewX(-18deg);
  }
  .card:hover .shine::before { animation: shine .7s ease-out; }
  @keyframes shine { to { left: 260px; } }

  .num {
    position: relative; color: var(--c); font-size: 84px; line-height: 1; font-weight: 800;
    padding-top: 10px; letter-spacing: -1px; animation: bob 4.2s ease-in-out infinite;
    animation-delay: var(--bd, 0s);
  }
  .num.pop { animation: pop .45s ease-out, bob 4.2s ease-in-out infinite var(--bd, 0s); }
  .unit { position: absolute; top: 10px; right: var(--ur); color: var(--c); font-size: 40px; line-height: 1; font-weight: 800; }
  .card:hover .unit { animation: wiggle .5s ease-in-out; }

  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes pop { 0% { transform: scale(.82); opacity: .4; } 60% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }

  /* ---------- Toggle ---------- */
  .toggle {
    position: absolute; z-index: 2; top: 669px; left: var(--l); width: 138px; height: 67px;
    border: 0; border-radius: 34px; padding: 0; background: var(--box);
    cursor: pointer; outline: none;
    transition: background-color .3s ease, transform .2s ease;
  }
  .toggle::after {
    content: ""; position: absolute; top: 10px; left: 10px; width: 47px; height: 47px; border-radius: 50%;
    background: var(--knob);
    transition: transform .35s cubic-bezier(.34,1.56,.64,1), background-color .3s ease, width .15s ease;
  }
  .toggle:hover { transform: scale(1.05); }
  .toggle:active::after { width: 58px; }
  .toggle[aria-checked="true"] { background: var(--c); }
  .toggle[aria-checked="true"]::after { background: #fff; transform: translateX(71px); }
  .toggle[aria-checked="true"]:active::after { transform: translateX(60px); }
  .toggle:focus-visible { box-shadow: 0 0 0 5px rgba(176,149,140,.55); }

  #fx { position: absolute; left: 0; top: 0; z-index: 3; width: 1920px; height: 1080px; }

  @media (prefers-reduced-motion: reduce) {
    .cloud, .glow, .shimmer::after, .num, .num.pop, .card::after, .unit { animation: none !important; }
    .card, .toggle, .toggle::after { transition: none; }
  }
</style>
</head>
<body>

<main class="stage" id="stage">
  <!-- พื้นหลังเคลื่อนไหว -->
  <div class="sky" aria-hidden="true">
    <div class="cloud" style="top:44px;  font-size:46px; --d:150s; --delay:-30s"></div>
    <div class="cloud" style="top:296px; font-size:26px; --d:110s; --delay:-75s"></div>
    <div class="cloud" style="top:92px;  font-size:34px; --d:190s; --delay:-120s"></div>
    <div class="cloud" style="top:300px; font-size:34px; --d:170s; --delay:-5s"></div>
  </div>
  <div class="glow" aria-hidden="true"></div>
  <div class="shimmer" aria-hidden="true"></div>

  <!-- กล่องค่า 4 กล่อง -->
  <div class="card" id="card-temp"  style="--l:378px;  --c:var(--red);    --ur:37px; --bd:0s"  data-min="20" data-max="38"><span class="shine"></span><span class="unit">°C</span><span class="num">25</span></div>
  <div class="card" id="card-humid" style="--l:697px;  --c:var(--green);  --ur:33px; --bd:-1s" data-min="40" data-max="90"><span class="shine"></span><span class="unit">%</span><span class="num">60</span></div>
  <div class="card" id="card-light" style="--l:1015px; --c:var(--orange); --ur:24px; --bd:-2s" data-min="50" data-max="999"><span class="shine"></span><span class="unit">CD</span><span class="num">100</span></div>
  <div class="card" id="card-water" style="--l:1333px; --c:var(--blue);   --ur:26px; --bd:-3s" data-min="1" data-max="30"><span class="shine"></span><span class="unit">CM</span><span class="num">10</span></div>

  <!-- ปุ่ม toggle -->
  <button class="toggle" style="--l:414px;  --c:var(--red)"    role="switch" aria-checked="false" aria-label="อุณหภูมิ"  data-target="card-temp"></button>
  <button class="toggle" style="--l:732px;  --c:var(--green)"  role="switch" aria-checked="false" aria-label="ความชื้น"  data-target="card-humid"></button>
  <button class="toggle" style="--l:1056px; --c:var(--orange)" role="switch" aria-checked="false" aria-label="ค่าแสง"     data-target="card-light"></button>
  <button class="toggle" style="--l:1372px; --c:var(--blue)"   role="switch" aria-checked="false" aria-label="ระดับน้ำ"  data-target="card-water"></button>

  <canvas id="fx" class="fx-layer" aria-hidden="true"></canvas>
</main>

<script>
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const stage = document.getElementById('stage');
  const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
  let S = 1, K = 1;

  /* ---------- ปรับเวทีให้เต็มจอ ---------- */
  function fit() {
    S = Math.max(innerWidth / 1920, innerHeight / 1080);
    stage.style.setProperty('--s', S);
    K = Math.min(2, S * (devicePixelRatio || 1));
    cv.width = Math.round(1920 * K); cv.height = Math.round(1080 * K);
  }
  addEventListener('resize', fit); fit();
  const toStage = e => { const r = stage.getBoundingClientRect(); return { x: (e.clientX - r.left) / (r.width / 1920), y: (e.clientY - r.top) / (r.height / 1080) }; };

  /* ---------- ค่าสุ่ม + นับเลขนุ่มๆ ---------- */
  const rnd = (a, b) => a + Math.random() * (b - a);
  const rand = (min, max) => Math.floor(rnd(min, max + 1));

  const cards = [...document.querySelectorAll('.card')].map(el => ({
    el, numEl: el.querySelector('.num'), min: +el.dataset.min, max: +el.dataset.max, value: 0, raf: 0
  }));

  function setValue(c, next) {
    cancelAnimationFrame(c.raf);
    const from = c.value, start = performance.now(), dur = 700;
    c.numEl.classList.remove('pop'); void c.numEl.offsetWidth; c.numEl.classList.add('pop');
    (function tick(t) {
      const p = Math.min((t - start) / dur, 1), e = 1 - Math.pow(1 - p, 3);
      c.numEl.textContent = Math.round(from + (next - from) * e);
      if (p < 1) c.raf = requestAnimationFrame(tick); else c.value = next;
    })(start);
  }
  cards.forEach((c, i) => setTimeout(() => setValue(c, rand(c.min, c.max)), 150 + i * 160));

  /* ---------- เอียงกล่อง 3 มิติตามเมาส์ ---------- */
  cards.forEach(c => {
    c.el.addEventListener('mousemove', e => {
      const r = c.el.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width - .5, py = (e.clientY - r.top) / r.height - .5;
      c.el.style.setProperty('--ry', (px * 14) + 'deg');
      c.el.style.setProperty('--rx', (-py * 14) + 'deg');
    });
    c.el.addEventListener('mouseleave', () => {
      c.el.style.setProperty('--rx', '0deg'); c.el.style.setProperty('--ry', '0deg');
    });
  });

  /* ---------- Toggle ---------- */
  // เปิด = เซนเซอร์นั้น "สด" สุ่มค่าใหม่ทุก 2 วินาที / ปิด = ค่าคงที่
  const COLORS = { 'card-temp': '#ee7b6b', 'card-humid': '#94bb6f', 'card-light': '#fda26b', 'card-water': '#7ab5e0' };
  document.querySelectorAll('.toggle').forEach(btn => {
    const card = document.getElementById(btn.dataset.target);
    const c = cards.find(x => x.el === card);
    btn.addEventListener('click', () => {
      const on = btn.getAttribute('aria-checked') !== 'true';
      btn.setAttribute('aria-checked', on);
      card.classList.toggle('on', on);
      if (on) setValue(c, rand(c.min, c.max));
      if (!REDUCED) burst(btn.offsetLeft + 69, btn.offsetTop + 33, COLORS[btn.dataset.target], on ? 30 : 12);
    });
  });
  setInterval(() => cards.forEach(c => c.el.classList.contains('on') && setValue(c, rand(c.min, c.max))), 2000);

  /* ============ เอฟเฟกต์ Canvas ============ */
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const LEAF = ['#e6c52e', '#d9a62e', '#b0c58f', '#f0b9a8', '#f3dd7a'];

  // ใบข้าว/ละอองที่ปลิวตามลม
  const leaves = Array.from({ length: 26 }, () => newLeaf(true));
  function newLeaf(init) {
    return { x: init ? rnd(0, 1920) : rnd(-200, 1700), y: init ? rnd(0, 1080) : rnd(-40, -10),
      vx: rnd(14, 40), vy: rnd(18, 42), r: rnd(3, 7), rot: rnd(0, 6.28), vr: rnd(-2, 2),
      ph: rnd(0, 6.28), col: pick(LEAF), a: rnd(.5, .9) };
  }

  // นกบินผ่านเป็นฝูง
  const birds = [];
  function flock() {
    const dir = Math.random() < .5 ? 1 : -1, y0 = rnd(60, 270), n = 3 + Math.floor(rnd(0, 3)), sp = rnd(110, 150);
    for (let i = 0; i < n; i++) birds.push({
      x: dir > 0 ? -60 - i * 60 : 1980 + i * 60, y: y0 + (i % 2 ? 1 : -1) * i * 14,
      vx: dir * sp, ph: rnd(0, 6), s: rnd(.8, 1.2) });
  }
  setTimeout(flock, 3000); setInterval(flock, 12000);

  // ระลอกน้ำที่บ่อมุมขวาล่าง + ระลอกตอนคลิก
  const rings = [];
  setInterval(() => rings.push({ x: rnd(1720, 1880), y: rnd(1020, 1058), r: 2, max: rnd(40, 60), pond: true }), 1500);
  addEventListener('pointerdown', e => {
    const p = toStage(e); rings.push({ x: p.x, y: p.y, r: 4, max: 70, pond: false, col: '#e6c52e' });
  });

  // ประกายตามเมาส์ + ระเบิดประกายตอนกด toggle
  const sparks = [];
  function burst(x, y, col, n) {
    for (let i = 0; i < n; i++) {
      const a = rnd(0, 6.28), v = rnd(120, 360);
      sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, life: rnd(.6, 1.1), t: 0,
        col: Math.random() < .25 ? '#ffffff' : col, r: rnd(3, 7), g: 520 });
    }
  }
  let lastTrail = 0;
  addEventListener('pointermove', e => {
    if (REDUCED || e.timeStamp - lastTrail < 45) return;
    lastTrail = e.timeStamp;
    const p = toStage(e);
    sparks.push({ x: p.x, y: p.y, vx: rnd(-14, 14), vy: rnd(-26, -6), life: .7, t: 0, col: pick(LEAF), r: rnd(2, 4.5), g: 0 });
  });

  function drawBird(b, t) {
    const f = Math.sin(t * 8 + b.ph), s = b.s;
    ctx.beginPath();
    ctx.moveTo(-17 * s, -7 * s * f);
    ctx.quadraticCurveTo(-8 * s, -11 * s * f - 3, 0, 0);
    ctx.quadraticCurveTo(8 * s, -11 * s * f - 3, 17 * s, -7 * s * f);
    ctx.stroke();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000), t = now / 1000; last = now;
    ctx.setTransform(K, 0, 0, K, 0, 0);
    ctx.clearRect(0, 0, 1920, 1080);

    // ใบไม้
    for (const l of leaves) {
      l.x += (l.vx + Math.sin(t * 1.2 + l.ph) * 20) * dt; l.y += l.vy * dt; l.rot += l.vr * dt;
      if (l.y > 1100 || l.x > 1980) Object.assign(l, newLeaf(false));
      ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.rot);
      ctx.globalAlpha = l.a; ctx.fillStyle = l.col;
      ctx.beginPath(); ctx.ellipse(0, 0, l.r * 1.7, l.r * .7, 0, 0, 6.283); ctx.fill();
      ctx.restore();
    }

    // นก
    ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.strokeStyle = '#8a6b5d'; ctx.globalAlpha = .75;
    for (let i = birds.length - 1; i >= 0; i--) {
      const b = birds[i]; b.x += b.vx * dt; b.y += Math.sin(t * 1.5 + b.ph) * 8 * dt;
      if (b.x < -150 || b.x > 2070) { birds.splice(i, 1); continue; }
      ctx.save(); ctx.translate(b.x, b.y); drawBird(b, t); ctx.restore();
    }

    // ระลอก
    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i]; r.r += (r.pond ? 30 : 140) * dt;
      const a = 1 - r.r / r.max; if (a <= 0) { rings.splice(i, 1); continue; }
      ctx.globalAlpha = a * (r.pond ? .85 : .7); ctx.lineWidth = r.pond ? 2 : 3;
      ctx.strokeStyle = r.pond ? '#ffffff' : r.col;
      ctx.beginPath();
      if (r.pond) ctx.ellipse(r.x, r.y, r.r, r.r * .3, 0, 0, 6.283); else ctx.arc(r.x, r.y, r.r, 0, 6.283);
      ctx.stroke();
    }

    // ประกาย
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i]; p.t += dt;
      if (p.t > p.life) { sparks.splice(i, 1); continue; }
      p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 - p.t / p.life * .5), 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  if (!REDUCED) requestAnimationFrame(frame);
</script>
</body>
</html>
